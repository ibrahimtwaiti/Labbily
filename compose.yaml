services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LABBILY_DB: /data/labbily.sqlite3
      LABBILY_ENV: ${LABBILY_ENV:-development}
      LABBILY_ORIGIN: ${LABBILY_ORIGIN:-http://localhost:8000}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
    volumes:
      - labbily-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "labbily.worker"]
    environment:
      LABBILY_DB: /data/labbily.sqlite3
    volumes:
      - labbily-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  labbily-data:
